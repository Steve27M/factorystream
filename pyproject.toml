[project]
name = "factorystream"
version = "0.1.0"
description = "Streaming manufacturing-telemetry lakehouse with provable completeness"
readme = "README-factorystream.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "pyarrow>=16.0.0",        # parquet writer for bronze + manifests
    # Windows ships no system timezone database, so pyarrow cannot read back a
    # tz-aware timestamp without this. Omitting it means parquet round-trips
    # pass on Linux CI and fail on a developer's laptop — an environment-
    # dependent bug, which is the worst kind to debug.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
contracts = [
    # The event contract is validated at the producer, so this is a runtime
    # dependency of a normal `make publish`, not a dev tool.
    "jsonschema>=4.20.0",
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
]
# Phase 2+. Kept out of the default install so Phase 1 — the generator, which is
# pure Python — needs no broker client and no cloud SDK to develop or test.
stream = [
    "confluent-kafka>=2.5.0",
]
cloud = [
    "boto3>=1.34.0",
    "dbt-athena-community>=1.8.0",
]
warehouse = [
    # The second dbt target. Reads the same parquet the consumer wrote, so the
    # model set can be executed - and therefore checked - without AWS.
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
]

[project.scripts]
factorystream-generate = "factorystream.generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorystream"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["factorystream"]

# Neither ships type stubs or a py.typed marker. `boto3-stubs` exists but pulls
# a large generated dependency for the handful of calls this project makes.
# `jsonschema` ships stubs only via types-jsonschema, which types the validator
# API loosely enough to be worth less than the install.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "boto3.*", "botocore.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Integration tests need a running broker. Excluded by default, because a
# unit suite that needs Docker is a unit suite people stop running.
# Both heavy suites are excluded by default. A unit suite that needs Docker,
# or that builds a lake and runs dbt, is a unit suite people stop running.
addopts = "-m 'not integration and not warehouse'"
markers = [
    "integration: requires a running Redpanda broker (make broker)",
    "warehouse: builds a lake and runs dbt; needs `dbt deps` to have run",
]
