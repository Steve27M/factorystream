name: factorystream
version: "0.1.0"
config-version: 2

profile: factorystream

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Athena bills per TB scanned, so materialisation choice is a cost decision as
# much as a modelling one. Views scan the underlying data on every query; tables
# pay once. Silver and gold are tables because the ledger reads them repeatedly.
models:
  factorystream:
    +materialized: table

    # Materialised tables MUST live in the lake bucket, not the Athena results
    # bucket.
    #
    # Set at model level deliberately. dbt-athena's `_s3_table_prefix` docstring
    # claims it falls back to the connection's `s3_data_dir`, but the code only
    # reads the model-level value and otherwise uses `s3_staging_dir/tables/`:
    #
    #     if s3_data_dir is not None:      # model-level only
    #         return s3_data_dir
    #     return path.join(creds.s3_staging_dir, "tables")
    #
    # The profile setting is therefore silently ignored, and every table landed
    # in the results bucket — which carries a 7-day expiration rule, because
    # query results are scratch. Silver, gold and the ledger would have vanished
    # a week later with no error, and queries would simply have returned nothing.
    # env_var, not a literal: a hardcoded bucket name makes the repo work for
    # exactly one AWS account, and a portfolio repo someone cannot clone and
    # run is a screenshot with extra steps.
    # Athena-only, but it must still PARSE under DuckDB. `env_var` is evaluated
    # at parse time, so an unguarded reference makes every DuckDB run fail
    # before it starts, on a variable that target has no use for. A `{% if %}`
    # block does not work here either - this file is scanned as YAML before any
    # Jinja control flow runs, and the block breaks the scanner outright.
    #
    # So: a default. DuckDB parses it, ignores it, and never touches S3.
    +s3_data_dir: "s3://{{ env_var('FS_LAKE_BUCKET', 'athena-target-only') }}/warehouse/"
    +s3_data_naming: schema_table
    staging:
      # Views: staging is thin parsing over bronze, and materialising it would
      # double the storage for no query benefit.
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table
    recon:
      +materialized: table

# Everything below `vars` is config rather than hardcoded, per the ladder
# convention that anything a reviewer might want to change should be visible.
vars:
  # How far back to recompute on each run. Late arrivals land up to 6 hours
  # after their event time, so a shorter window would silently drop them and a
  # much longer one costs Athena scans for data that cannot change.
  # decisions entry 6 — the cost/completeness compromise, stated.
  late_arrival_window_hours: 8
  # Windows younger than this are still inside the watermark and are expected
  # to be incomplete. The ledger reports them `pending`, not `broken`.
  watermark_hours: 8
